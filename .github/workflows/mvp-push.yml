name: MVP voting closed push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify players when MVP voting closes
        env:
          CRON_TOKEN: ${{ secrets.ATTENDANCE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::Configure ATTENDANCE_CRON_SECRET in repository Actions secrets"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            -H "Authorization: Bearer $CRON_TOKEN" \
            "https://lastdancefc.vercel.app/api/mvp-push"
