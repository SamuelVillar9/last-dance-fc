name: Team area checks
on:
  push:
    branches: [main, feature/team-area]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: team_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: team_test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55555
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Isolated PostgreSQL integration tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/team-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610300001_initial.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610300002_strict_validation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/team-area.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030091522_user_activity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030120704_match_comments.sql
          psql -v ON_ERROR_STOP=1 -c "create role service_role nologin;"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030123937_rincon_interactions.sql
          psql -v ON_ERROR_STOP=1 -f tests/rincon.sql
          psql -v ON_ERROR_STOP=1 -f tests/comments.sql
          psql -v ON_ERROR_STOP=1 -f tests/team.sql
          psql -v ON_ERROR_STOP=1 -f tests/activity.sql
      - name: Production build without production credentials
        run: npm run build
      - name: Install browser test tools only in CI
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks with mocked accounts (no production access)
        run: npx playwright test --config tests/browser.config.mjs

